plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base{
    archivesName = project.mod_author+"-"+project.mod_name+"-v"+project.mod_version+"-fabric-"+project.minecraft_version
}

loom {
    accessWidenerPath = file("src/client/resources/nitroito_tooltips.accesswidener")
    splitEnvironmentSourceSets()
    mods {
        "nitroito_tooltips" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
       }
    }
    runs {
        client {
            runDir = "run/fabric-${project.minecraft_version}"
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api}"
    modImplementation "com.terraformersmc:modmenu:${project.mod_menu}"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config}"
}

processResources {
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version,
                "name": project.mod_name,
                "author": project.mod_author,
                "description": project.mod_description,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    //withSourcesJar()
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
        // Add repositories to publish to here.
    }
}
